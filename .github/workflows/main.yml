name: Build, Test, and Publish Latest Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JAVA_VERSION: "25"
  RELEASE_TAG: latest
  RELEASE_TITLE: Latest build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply source formatting
        run: ./gradlew spotlessApply

      - name: Commit formatting
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java src/test/java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main/java src/test/java
          git commit -m "style: apply Spotless formatting"
          git push origin "HEAD:$HEAD_REF"

      - name: Build and test
        run: ./gradlew clean build --warning-mode all

      - name: Collect release JARs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | sort)

          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release JAR files found in build/libs"
            exit 1
          fi

          cp "${jars[@]}" dist/

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Publish rolling latest release
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(dist/*.jar)

          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No JAR files found in dist"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          notes_file="$(mktemp)"
          {
            echo "Automatic latest build"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$notes_file"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$notes_file" \
              --latest \
              --verify-tag
          fi

          gh release upload "$TAG" "${jars[@]}" \
            --repo "$REPO" \
            --clobber
