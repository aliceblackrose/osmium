namespace: osmium
base-item: PAPER
custom-model-data-start: 100000
pack-format: 84
blueprints-folder: blueprints
resource-pack-folder: resource_pack
auto-generate-pack-on-reload: true
render:
  # Maximum spacing between compiled animation targets. BetterModel v3 defaults to 3 ticks;
  # Osmium keeps the same cap while the packet renderer itself advances every 25 ms.
  interpolation-duration: 1
  teleport-duration: 1
  view-range: 64.0
  # One native display shadow is emitted per model. Radius 0 auto-sizes from the model footprint.
  shadow-enabled: true
  shadow-radius: 0.0
  shadow-strength: 0.75
  # false uses per-part world lighting. Set true to force the fixed block/sky levels below.
  brightness-override: false
  brightness-block: 15
  brightness-sky: 15
  scale: 1.0
  ground-align: true
