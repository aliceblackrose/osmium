name: Osmium
version: ${version}
main: osmium.OsmiumPlugin
api-version: '1.21'
authors: [AliceBlackrose, Auuki]
load: POSTWORLD
description: Clean-room ModelEngine-style Blockbench renderer (Osmium).
commands:
  om:
    description: Osmium commands.
    usage: /om <reload|pack|list|spawn|spawnmob|play|remove|debug>
permissions:
  osmium.admin:
    default: op
  modelenginelike.admin:
    description: Legacy Osmium administrator permission alias.
    default: op
