namespace: osmium
base-item: PAPER
custom-model-data-start: 100000
pack-format: 84
blueprints-folder: blueprints
models-folder: models
resource-pack-folder: resource_pack
auto-generate-pack-on-reload: true
render:
  # Three ticks lets the client blend consecutive 20 TPS bone transforms instead of exposing
  # individual server-tick steps. Lower this if you prefer less visual latency over smoothness.
  interpolation-duration: 3
  teleport-duration: 1
  view-range: 64.0
  shadow-radius: 0.0
  shadow-strength: 0.0
  brightness-block: 15
  brightness-sky: 15
  scale: 1.0
  ground-align: true
