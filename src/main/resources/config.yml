namespace: osmium
base-item: PAPER
custom-model-data-start: 100000
pack-format: 84
blueprints-folder: blueprints
models-folder: models
resource-pack-folder: resource_pack
auto-generate-pack-on-reload: true
render:
  # Maximum spacing between compiled animation targets. The runtime uses each compiled frame's
  # actual duration and only resends local transforms when the target pose changes.
  interpolation-duration: 5
  teleport-duration: 1
  view-range: 64.0
  shadow-radius: 0.0
  shadow-strength: 0.0
  brightness-block: 15
  brightness-sky: 15
  scale: 1.0
  ground-align: true
